# AAIF Agent Stack: LLM + Agent Skills + Context + Actions, built on Agentic AI Foundation projects.
#
#   docker compose up --build                     core stack (OpenAI or Claude via agentgateway)
#   docker compose --profile local up --build     + Ollama for offline models
#   docker compose --profile rag up --build       + Milvus knowledge search
#   docker compose --profile observe up --build   + Jaeger traces from agentgateway
name: aaif

x-mcp-bridge: &mcp-bridge
  build: ./mcp-servers/stdio-bridge
  restart: unless-stopped
  volumes:
    - ./workspace:/workspace

services:
  # ---------------------------------------------------------------- UI
  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
      - ./ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:3000:80"
    depends_on: [agent]

  # ---------------------------------------------------------------- Agent runtime
  agent:
    build: ./agent
    environment:
      LLM_BASE_URL: http://gateway:4000
      MCP_URL: http://gateway:3001/mcp
      DEFAULT_MODEL: ${DEFAULT_MODEL:-openai/gpt-5.5}
      AVAILABLE_MODELS: ${AVAILABLE_MODELS:-openai/gpt-5.5,openai/gpt-4.1,anthropic/claude-sonnet-5-5,anthropic/claude-haiku-5-5,anthropic/claude-opus-5-5,ollama/qwen3:8b}
      MAX_STEPS: ${MAX_STEPS:-24}
      SKILLS_DIR: /skills
      WORKSPACE_DIR: /workspace
      PUBLIC_URL: http://localhost:8080
    volumes:
      - ./skills:/skills:ro
      - ./workspace:/workspace:ro
      - ./scripts:/scripts:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on: [gateway]

  # ---------------------------------------------------------------- Gateway (LLM + MCP)
  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.6.0
    command: ["-f", "/config/config.yaml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # for the ollama-host/* route
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./gateway/config.yaml:/config/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"   # LLM endpoint (OpenAI / Anthropic compatible)
      - "127.0.0.1:3001:3001"   # MCP endpoint (all tools multiplexed)
      - "127.0.0.1:15000:15000" # admin UI
    depends_on: [mcp-filesystem, mcp-git, mcp-fetch, mcp-sandbox]

  # ---------------------------------------------------------------- MCP servers (context + actions)
  mcp-filesystem:
    <<: *mcp-bridge
    command: ["filesystem"]
  mcp-git:
    <<: *mcp-bridge
    command: ["git"]
  mcp-fetch:
    <<: *mcp-bridge
    command: ["fetch"]
    volumes: []

  mcp-sandbox:
    build:
      context: ./sandbox
      dockerfile: mcp.Dockerfile
    restart: unless-stopped
    environment:
      OPEN_SANDBOX_API_KEY: ${SANDBOX_API_KEY:-aaif-local-sandbox-key}
    depends_on: [opensandbox-server]

  # ---------------------------------------------------------------- OpenSandbox (code execution)
  opensandbox-server:
    image: opensandbox/server:release-1.1.1
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      SANDBOX_CONFIG_PATH: /etc/opensandbox/config.toml
      OPENSANDBOX_SERVER_API_KEY: ${SANDBOX_API_KEY:-aaif-local-sandbox-key}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./sandbox/config.toml:/etc/opensandbox/config.toml:ro
    ports:
      - "127.0.0.1:8090:8090"

  # ---------------------------------------------------------------- profile: local (Ollama)
  ollama:
    image: ollama/ollama:0.40.10
    profiles: [local]
    environment:
      # The agent prompt (skills catalog + ~50 tool schemas) needs more than the 4k default.
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-16384}
      OLLAMA_KEEP_ALIVE: 30m
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
  ollama-pull:
    image: ollama/ollama:0.40.10
    profiles: [local]
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${OLLAMA_MODEL:-qwen3:8b}"]
    depends_on: [ollama]
    restart: "no"

  # ---------------------------------------------------------------- profile: rag (Milvus)
  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    profiles: [rag]
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd:/etcd
  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    profiles: [rag]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    volumes:
      - minio:/minio_data
  milvus:
    image: milvusdb/milvus:v2.6.26
    profiles: [rag]
    command: ["milvus", "run", "standalone"]
    security_opt: ["seccomp:unconfined"]
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 15s
      start_period: 90s
      timeout: 10s
      retries: 10
    ports:
      - "127.0.0.1:19530:19530"
    depends_on: [etcd, minio]
  mcp-milvus:
    build: ./mcp-servers/milvus
    profiles: [rag]
    restart: unless-stopped
    environment:
      MILVUS_URI: http://milvus:19530
    depends_on:
      milvus: {condition: service_healthy}
  rag-indexer:
    build: ./rag-indexer
    profiles: [rag]
    restart: "no"
    volumes:
      - ./workspace:/workspace:ro
    depends_on:
      milvus: {condition: service_healthy}

  # ---------------------------------------------------------------- profile: observe (Jaeger)
  jaeger:
    image: jaegertracing/jaeger:2.22.0
    profiles: [observe]
    ports:
      - "127.0.0.1:16686:16686"

volumes:
  ollama:
  etcd:
  minio:
  milvus:
