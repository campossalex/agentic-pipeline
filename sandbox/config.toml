# OpenSandbox lifecycle server (AAIF project), Docker runtime.
# Sandboxes are sibling containers created through the mounted Docker socket.
[server]
host = "0.0.0.0"
port = 8090
max_sandbox_timeout_seconds = 3600

[proxy]
# The server sits on the compose network; sandboxes sit on Docker's bridge.
# Reach them through host-published ports.
resolve_internal = false

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:release-1.1.1"

[egress]
image = "opensandbox/egress:release-1.1.1"
readiness_timeout_seconds = 30.0

[docker]
network_mode = "bridge"
host_ip = "host.docker.internal"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096

[ingress]
mode = "direct"
