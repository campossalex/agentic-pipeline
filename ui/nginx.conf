server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/(v1|api|a2a|\.well-known)/ {
        proxy_pass http://agent:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
    }

    location = /nginx.conf { return 404; }
}
